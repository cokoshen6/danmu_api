name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'danmu_api/**'
      - 'package.json'
      - 'deploy/**'
      - '.github/workflows/deploy-cf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node deploy/deploy-cf.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 442a63ce1b63f7e544c4361287b7cdc3
